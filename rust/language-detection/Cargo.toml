
[package]
authors     = ["Lesedi Kekana"]
description = "A Tauri App"
edition     = "2021"
name        = "language_detection"
version     = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow        = "1.0.102"
file-identify = "0.2.0"
hyperpolyglot = "0.1.7"
napi          = "3.0.0"
napi-derive   = "3.0.0"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto   = true
strip = "symbols"
