
[package]
authors = ["Lesedi Kekana"]
edition = "2021"
name = "language_detection"
version = "0.1.0"
description = "A Tauri App"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3.0.0"
napi-derive = "3.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyperpolyglot = "0.1.7"
anyhow = "1.0.102"
file-identify = "0.2.0"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
