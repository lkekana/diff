name: CI
env:
  DEBUG: napi:*
  APP_NAME: language-detection
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'

on:
  push:
    branches:
      - main
      - ci-test
    tags-ignore:
      - '**'
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**
  pull_request: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 10
          cache: true

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cargo fmt
        working-directory: ./rust/language-detection
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: ./rust/language-detection
        run: cargo clippy
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: pnpm build --target x86_64-apple-darwin
          - host: windows-latest
            build: pnpm build --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm build --target aarch64-apple-darwin
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm build --target aarch64-pc-windows-msvc
    name: stable - ${{ matrix.settings.target }} - node@20
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 10
          cache: true

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}
      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (napi-rs / Rust)
        working-directory: ./rust/language-detection
        run: pnpm build --target ${{ matrix.settings.target }}
        shell: bash

      - name: Build frontend
        run: |
          pnpm tsc && pnpm vite build
        shell: bash

      - name: Build Electron app for target
        run: |
          # Map napi-rs target to electron-builder flags
          case "${{ matrix.settings.target }}" in
            x86_64-apple-darwin)
              ELECTRON_FLAGS="--mac --x64"
              ;;
            aarch64-apple-darwin)
              ELECTRON_FLAGS="--mac --arm64"
              ;;
            x86_64-pc-windows-msvc)
              ELECTRON_FLAGS="--win --x64"
              ;;
            aarch64-pc-windows-msvc)
              ELECTRON_FLAGS="--win --arm64"
              ;;
          esac
          
          pnpm exec electron-builder ${ELECTRON_FLAGS} --publish never
        shell: bash
        env:
          # Prevent code signing in CI (configure separately if needed)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Electron artifact
        uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.settings.target }}
          path: release/
          if-no-files-found: error

      # - name: Upload artifact
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: bindings-${{ matrix.settings.target }}
      #     path: |
      #       rust/language-detection/${{ env.APP_NAME }}.*.node
      #       rust/language-detection/${{ env.APP_NAME }}.*.wasm
      #     if-no-files-found: error
  test-macOS-windows-binding:
    name: Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc
            architecture: arm64
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
          - host: macos-latest
            target: x86_64-apple-darwin
            architecture: x64
        node:
          - '20'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 10
          cache: true

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          architecture: ${{ matrix.settings.architecture }}
        
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
  
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: rust/language-detection
      - name: List packages
        working-directory: ./rust/language-detection
        run: ls -R .
        shell: bash
      - name: Test bindings
        working-directory: ./rust/language-detection
        run: pnpm test